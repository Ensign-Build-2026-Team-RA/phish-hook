name: PhishHook Frontend Build

on:
  push:
    branches: [main, interactive-scanner]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: phish-hook

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: phish-hook/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React frontend
        run: npm run build
